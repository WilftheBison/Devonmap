<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward postcode map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  #wp-app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
  #wp-sidebar {
    width: 300px; min-width: 300px; background: var(--bg-sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  #wp-map { flex: 1; height: 100%; }
  .wp-home {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none; font-size: 13.5px;
  }
  .wp-home:hover { color: var(--accent-bright); }
  .wp-panel { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .wp-panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .wp-ward-name { margin: 0 0 2px; font-size: 19px; font-weight: 700; color: var(--text-bright); }
  .wp-ward-count { margin: 0; font-size: 13px; color: var(--text-dim); }
  #wp-ward-select {
    width: 100%; background: var(--bg-sidebar-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 8px; font-size: 14px;
  }
  .leaflet-tooltip.pc-label {
    background: none; border: none; box-shadow: none; padding: 0;
    font-size: 10px; font-weight: 600; color: #fff; pointer-events: none;
    text-shadow: -1px -1px 1px rgba(0,0,0,.9), 1px -1px 1px rgba(0,0,0,.9),
                 -1px 1px 1px rgba(0,0,0,.9), 1px 1px 1px rgba(0,0,0,.9);
  }
  .leaflet-tooltip.pc-label::before { display: none; }
  #wp-status { font-size: 13px; color: var(--text-dim); padding: 16px 20px; }
  @media (max-width: 720px) {
    #wp-app { flex-direction: column; }
    #wp-sidebar { width: 100%; min-width: 0; max-height: 50vh; }
  }
</style>
</head>
<body>

<div id="wp-app">
  <aside id="wp-sidebar">
    <a href="index.html" class="wp-home">&larr; Home (map)</a>

    <section class="wp-panel">
      <h2>Ward</h2>
      <select id="wp-ward-select"></select>
    </section>

    <section class="wp-panel">
      <p class="wp-ward-name" id="wp-ward-name">Loading&hellip;</p>
      <p class="wp-ward-count" id="wp-ward-count"></p>
    </section>

    <section class="wp-panel">
      <h2>Data</h2>
      <table id="wp-data-table" class="popup-table"></table>
    </section>

    <div id="wp-status" class="hidden"></div>
  </aside>

  <main id="wp-map"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="ward-postcodes.js"></script>
</body>
</html>
