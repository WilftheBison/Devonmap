<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward postcode map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  #wp-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 14px;
  }
  #wp-header h1 { font-size: 16px; margin: 0; color: var(--text-bright); font-weight: 600; }
  #wp-header .count { color: var(--text-dim); font-size: 13px; }
  #wp-map { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; }
  .leaflet-tooltip.pc-label {
    background: none; border: none; box-shadow: none; padding: 0;
    font-size: 10px; font-weight: 600; color: #fff; pointer-events: none;
    text-shadow: -1px -1px 1px rgba(0,0,0,.9), 1px -1px 1px rgba(0,0,0,.9),
                 -1px 1px 1px rgba(0,0,0,.9), 1px 1px 1px rgba(0,0,0,.9);
  }
  .leaflet-tooltip.pc-label::before { display: none; }
  #wp-map .pc-label { display: none; }
  #wp-map.show-pc-labels .pc-label { display: block; }
  #wp-status {
    position: absolute; top: 58px; left: 16px; z-index: 1000;
    color: var(--text-dim); font-size: 13px; background: var(--bg-sidebar);
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div id="wp-header">
    <h1 id="wp-ward-name">Loading&hellip;</h1>
    <span class="count" id="wp-count"></span>
  </div>
  <div id="wp-map"></div>
  <div id="wp-status" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="ward-postcodes.js"></script>
</body>
</html>
