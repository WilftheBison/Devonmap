<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward postcode map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  #wp-app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
  #wp-sidebar {
    width: 300px; min-width: 300px; background: var(--bg-sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  #wp-map { flex: 1; height: 100%; }
  .wp-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .wp-head h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--text-bright); }
  .wp-head .parent { margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }
  .wp-panel { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .wp-panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .leaflet-tooltip.pc-label {
    background: none; border: none; box-shadow: none; padding: 0;
    font-size: 10px; font-weight: 600; color: #fff; pointer-events: none;
    text-shadow: -1px -1px 1px rgba(0,0,0,.9), 1px -1px 1px rgba(0,0,0,.9),
                 -1px 1px 1px rgba(0,0,0,.9), 1px 1px 1px rgba(0,0,0,.9);
  }
  .leaflet-tooltip.pc-label::before { display: none; }
  #wp-status { font-size: 13px; color: var(--text-dim); padding: 16px 20px; }
  @media (max-width: 720px) {
    #wp-app { flex-direction: column; }
    #wp-sidebar { width: 100%; min-width: 0; max-height: 45vh; }
  }
</style>
</head>
<body>

<div id="wp-app">
  <aside id="wp-sidebar">
    <div class="wp-head">
      <h1 id="wp-ward-name">Loading&hellip;</h1>
      <p class="parent" id="wp-ward-parent"></p>
    </div>

    <section class="wp-panel">
      <h2>Data <span class="count" id="wp-count"></span></h2>
      <table id="wp-data-table" class="popup-table"></table>
    </section>

    <section class="wp-panel">
      <h2>Colour ward by</h2>
      <label class="field">
        <select id="wp-colour-column"></select>
      </label>
      <div id="wp-legend" class="legend hidden"></div>
    </section>

    <div id="wp-status" class="hidden"></div>
  </aside>

  <main id="wp-map"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="ward-postcodes.js"></script>
</body>
</html>
